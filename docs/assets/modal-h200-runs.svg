<svg xmlns="http://www.w3.org/2000/svg" width="929" height="343" viewBox="0 0 929 343" role="img" aria-labelledby="title desc">
  <title id="title">Two router-system1-h200 Modal runs</title>
  <desc id="desc">Two ephemeral router-system1-h200 jobs, each showing evaluate_release and a running train_on_h200 task on an H200 GPU.</desc>
  <rect width="929" height="343" fill="#111313"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(22 0)">
      <rect width="930" height="157" rx="6" fill="#202020"/>
      <text x="17" y="36" fill="#f7f7f7" font-size="18" font-weight="600">router-system1-h200</text>
      <g transform="translate(209 18)">
        <rect width="92" height="20" rx="10" fill="#173016"/>
        <text x="9" y="14" fill="#66d64f" font-size="13">ϟ Ephemeral</text>
      </g>
      <circle cx="22" cy="76" r="4" fill="none" stroke="#55585a" stroke-width="2"/>
      <text x="42" y="82" fill="#d9dee7" font-size="17">evaluate_release</text>
      <g transform="translate(512 66)">
        <rect width="72" height="20" rx="4" fill="#2b2b2b"/>
        <text x="7" y="14" fill="#bfc6cf" font-size="12">H200 GPU</text>
      </g>
      <circle cx="22" cy="108" r="5" fill="#6ce65b"/>
      <text x="42" y="115" fill="#d9dee7" font-size="17">train_on_h200</text>
      <g transform="translate(512 110)">
        <rect width="72" height="20" rx="4" fill="#2b2b2b"/>
        <text x="7" y="14" fill="#bfc6cf" font-size="12">H200 GPU</text>
      </g>
      <text x="42" y="140" fill="#61d649" font-size="16">⌁ 1 container, 1 input</text>
      <text x="893" y="35" fill="#b7cee5" font-size="14">Cr</text>
    </g>
    <g transform="translate(22 173)">
      <rect width="930" height="160" rx="6" fill="#202020"/>
      <text x="17" y="39" fill="#f7f7f7" font-size="18" font-weight="600">router-system1-h200</text>
      <g transform="translate(209 21)">
        <rect width="92" height="20" rx="10" fill="#173016"/>
        <text x="9" y="14" fill="#66d64f" font-size="13">ϟ Ephemeral</text>
      </g>
      <circle cx="22" cy="79" r="4" fill="none" stroke="#55585a" stroke-width="2"/>
      <text x="42" y="85" fill="#d9dee7" font-size="17">evaluate_release</text>
      <g transform="translate(512 69)">
        <rect width="72" height="20" rx="4" fill="#2b2b2b"/>
        <text x="7" y="14" fill="#bfc6cf" font-size="12">H200 GPU</text>
      </g>
      <circle cx="22" cy="111" r="5" fill="#6ce65b"/>
      <text x="42" y="118" fill="#d9dee7" font-size="17">train_on_h200</text>
      <g transform="translate(512 113)">
        <rect width="72" height="20" rx="4" fill="#2b2b2b"/>
        <text x="7" y="14" fill="#bfc6cf" font-size="12">H200 GPU</text>
      </g>
      <text x="42" y="143" fill="#61d649" font-size="16">⌁ 1 container, 1 input</text>
      <text x="893" y="38" fill="#b7cee5" font-size="14">Cr</text>
    </g>
  </g>
</svg>
